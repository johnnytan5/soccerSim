[workspace]
name = "soccer-sim"
channels = ["robostack-kilted", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
ros-kilted-desktop = "*"
ros-kilted-behaviortree-cpp = "*"
ros-kilted-backward-ros = "*"
ros-kilted-tf2-geometry-msgs = "*"
colcon-common-extensions = "*"
cmake = "*"
ninja = "*"
compilers = "*"
pkg-config = "*"
eigen = "*"
yaml-cpp = "*"
opencv = "*"
# rerun C++ SDK 0.20.3 (built by scripts/build_rerun.sh for brain) needs Arrow 18.
libarrow = "18.*"
numpy = "*"
scipy = "*"
pyyaml = "*"
pytest = "*"
# conda-forge pytorch shares conda's single libomp; PyPI torch bundles a second one and aborts on import.
pytorch = ">=2.3"

[pypi-dependencies]
mujoco = ">=3.2.6"
onnxruntime = "*"
soccer_sim = { path = ".", editable = true }
booster_assets = { path = "vendor/booster_assets", editable = true }

[activation]
scripts = ["scripts/activate.sh"]

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/vendor/booster_deploy"

[tasks]
fetch-models = "bash scripts/fetch_models.sh"
build-ws = "bash scripts/setup_ws.sh"
build-sim = { cmd = "bash scripts/setup_ws.sh", env = { PACKAGES = "brain soccer_sim_bridge" } }
test-ros = "bash -c 'source ros_ws/install/setup.bash && pytest -m \"ros and not slow\" ros_ws/src/soccer_sim_bridge/test -p no:cacheprovider'"
test = "pytest -m 'not slow and not ros'"
test-slow = "pytest -m slow"
launch = "python -m soccer_launcher"
bench-match = "python scripts/bench_match.py"
keeper = "bash scripts/run_sim.sh --viewer role:=goal_keeper"
keeper-quick = "bash scripts/run_sim.sh --viewer --quick role:=goal_keeper"
striker = "bash scripts/run_sim.sh --viewer --quick role:=striker player_id:=2"
